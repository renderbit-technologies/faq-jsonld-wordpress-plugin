name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares PHP >= 7.2, so check syntax down to that.
        php: ["7.2", "7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint plugin files
        run: find faq-jsonld.php uninstall.php includes -name '*.php' -print0 | xargs -0 -n1 php -l

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: cs2pr

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.4"
            wp: "6.5"
          - php: "7.4"
            wp: locked
          - php: "8.1"
            wp: locked
          - php: "8.3"
            wp: locked
            coverage: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_NAME: wordpress_test
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}

      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      - name: Switch WordPress version
        if: matrix.wp != 'locked'
        run: >-
          composer require --dev --no-interaction --with-all-dependencies
          "roots/wordpress-no-content:${{ matrix.wp }}.*"
          "wp-phpunit/wp-phpunit:${{ matrix.wp }}.*"

      - name: Run PHPUnit
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit

      - name: Run PHPUnit with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage.xml

  jest:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test -- --coverage

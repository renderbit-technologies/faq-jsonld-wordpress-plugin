name: Task
description: A development task, chore, or technical work item
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for development tasks, refactoring, documentation updates, or other technical work.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be accomplished?
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Provide a detailed description of the work to be done.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      description: List the subtasks needed to complete this work.
      placeholder: |
        - [ ] Subtask 1
        - [ ] Subtask 2
        - [ ] Subtask 3
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Are there any blockers, related issues, or dependencies for this task?

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any other context or considerations.
